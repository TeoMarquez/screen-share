<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share - Watch</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #unmute {
            position: fixed;
            right: 20px;
            bottom: 20px;

            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            opacity: 1;
            transition: opacity 0.2s;
        }

        #unmute.inactive {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <video
        id="screen"
        autoplay
        muted
        playsinline
    ></video>
    <button id="unmute">
        Activar audio
    </button>

    <script src="/static/watch.js"></script>
</body>
</html>
